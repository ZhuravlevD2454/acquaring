{% extends "base.html" %}
{% block title %}Вход в личный кабинет{% endblock %}
{% block content %}
<h1>Вход в личный кабинет</h1>
<form method="post" class="panel narrow stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Логин <input name="login" required maxlength="32" autocomplete="username"></label>
  <label>Пароль <input name="password" type="password" required maxlength="128"
                       autocomplete="current-password"></label>
  <button>Войти</button>
</form>
<p>Учебные учетные записи: Admin / 1234, Romashka / 123, Vasilek / 123.</p>
{% endblock %}
