{% extends "base.html" %}
{% block title %}ЛК — управление продавцами и сайтами{% endblock %}
{% block content %}
<h1>Управление продавцами и сайтами</h1>
<div class="grid">
  <form method="post" class="panel stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="action" value="seller">
    <h2>Добавить продавца</h2>
    <label>Логин <input name="login" minlength="3" maxlength="32" required></label>
    <label>Пароль <input name="password" type="password" minlength="8" maxlength="128" required></label>
    <label>Наименование <input name="legal_name" maxlength="100" required></label>
    <label>Учебный ИНН <input name="tax_id" inputmode="numeric" maxlength="12" required></label>
    <button>Создать продавца</button>
  </form>
  <form method="post" class="panel stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="action" value="site">
    <h2>Добавить сайт</h2>
    <label>Продавец
      <select name="seller_id" required>
        <option value="">Выберите продавца</option>
        {% for s in sellers %}<option value="{{ s.id }}">{{ s.login }} — {{ s.legal_name }}</option>{% endfor %}
      </select>
    </label>
    <label>Название <input name="name" maxlength="100" required></label>
    <label>URL-имя <input name="slug" maxlength="40" placeholder="test-shop" required></label>
    <label>Шаблон
      <select name="kind">
        <option value="romashka">По типу «Ромашки»</option>
        <option value="vasilek">По типу «Василька»</option>
      </select>
    </label>
    <button>Создать сайт</button>
  </form>
</div>
{% endblock %}
